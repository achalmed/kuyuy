# pyproject.toml — el paquete de Python de Kuyuy (el editor de videos): dependencias y extras
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kuyuy"
version = "0.1.0"
description = "Kuyuy: el editor de videos de la plataforma Qillqa (línea de tiempo con pistas, títulos, música y subtítulos; render con ffmpeg o ffmpeg.wasm), que funciona dentro de Qillqa o solo con el anfitrión mínimo de Tiqsi."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = ["tiqsi", "ruray", "fastapi>=0.110", "pydantic-settings>=2", "PyJWT>=2.8", "Pillow>=10", "PyYAML>=6"]

[project.optional-dependencies]
sola = ["uvicorn[standard]>=0.30"]
pruebas = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["kuyuy"]
